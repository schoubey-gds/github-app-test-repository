# kiro-cli --resume-id be13228c-fb8a-40f6-854f-e65acd7d6ea7
name: Release PoC

on:
  push:
    branches: [main]      # Option 1: automatic on merge to main
  workflow_dispatch: {}   # Option 2: manual

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # MUST be false. The release job pushes its own bump commit to main, which
  # re-triggers this workflow. With cancel-in-progress: true the second run
  # cancels the first *mid-flight* (concurrency cancellation happens before the
  # job-level `if` guard runs) — verified on v0.4.0, where "Create GitHub
  # release" was cancelled during its "not yet discoverable, retrying" wait, so
  # the tag was never created. The re-triggered run is a harmless no-op
  # (skipped by the chore(version) guard), so let the first run finish.
  cancel-in-progress: false

jobs:
  create-release:
    name: Create release
    # Runs on pushes to main. The release bot pushes its own "chore(version)"
    # bump commit back to main, which re-triggers this workflow. To avoid an
    # infinite release loop we explicitly skip runs whose head commit is the
    # bot's bump commit. If a real release commit slips through, cocogitto is
    # still a no-op when there are no version-bumping commits since the last tag.
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(version):')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Mint a token from the installed GitHub App so the bump commit/tag can be
      # pushed to protected main and re-trigger workflows (the default
      # GITHUB_TOKEN cannot). The App is a bypass actor on the tag ruleset.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                      # full history for cocogitto
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # cocogitto computes the semver from conventional commits, runs the
      # pre_bump hook (npm version -> bare version in package.json) and creates
      # the bump commit + v-prefixed tag. `version` output is set only when a
      # release actually happens (empty otherwise -> no-op).
      - name: Create release (cocogitto bump)
        id: release
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto
          git-user: "release-bot[bot]"
          git-user-email: "release-bot[bot]@users.noreply.github.com"

      # Push the bump commit, then the tag EXPLICITLY.
      #
      # cocogitto 6.4.0 creates a LIGHTWEIGHT tag. `git push --follow-tags`
      # only pushes ANNOTATED tags (verified against git-scm.com docs and by
      # test), so it would push the commit and SILENTLY skip the tag while
      # still exiting 0 — leaving a bumped package.json with no matching tag on
      # the remote, so publish.yml (which triggers on v* tag pushes) never
      # fires. We therefore push the tag by its exact ref.
      #
      # steps.release.outputs.version is `git describe` of the newest tag, i.e.
      # the v-prefixed tag name (e.g. v0.4.0).
      - name: Push bump commit and tag
        if: steps.release.outputs.version != ''
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git push origin "refs/tags/${{ steps.release.outputs.version }}"

      # GitHub Release (kept here for now to validate mechanics; moves to the
      # publish workflow in the target design). The cocogitto-action's `version`
      # output is `git describe` of the newest tag, so it is ALREADY prefixed
      # (e.g. v0.2.0). Use it verbatim — do NOT add another "v".
      - name: Create GitHub release
        if: steps.release.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.release.outputs.version }}
          generate_release_notes: true
